<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#E7E9EB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1012" media="(prefers-color-scheme: dark)">
  {{seo}}
  <link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var root = document.documentElement, saved = null, dark = false;
      root.classList.add('js');
      try { saved = localStorage.getItem('fl-theme'); } catch (e) {}
      try { dark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
      root.dataset.theme = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="preload" href="{{root}}assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  {{preloadTag}}
  <link rel="stylesheet" href="{{root}}assets/css/site.css">
  <script src="{{root}}assets/js/site.js" defer></script>
</head>
<body class="page-{{page}}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{> header}}
  <main id="main">
{{content}}
  </main>
  {{> footer}}
</body>
</html>

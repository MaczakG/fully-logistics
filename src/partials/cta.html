<section class="cta" aria-labelledby="cta-title">
  <div class="wrap">
    <div class="cta__panel" data-reveal>
      <div class="cta__stripe" aria-hidden="true"></div>
      <div class="cta__grid">
        <div class="cta__copy">
          <h2 id="cta-title">{{cta.title}}</h2>
          <p>{{cta.text}}</p>
          <a class="btn btn--dark btn--lg" href="{{root}}contact.html">Get a quote {{icon:arrow-right}}</a>
        </div>
        <div class="cta__media media">
          {{img name="dock-trailers" alt="Trailers backed up to the loading bays of a distribution centre" sizes="(min-width: 900px) 42vw, 100vw"}}
        </div>
      </div>
    </div>
  </div>
</section>
